<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunline Trophy Desk</title>
<link rel="stylesheet" href="desk.css">
</head>
<body>
<header id="audit" class="audit">
  <div class="brand">
    <span class="sun" aria-hidden="true"></span>
    <div>
      <p class="eyebrow">Offline desk copy</p>
      <h1>Sunline Trophy Desk</h1>
    </div>
  </div>
  <dl class="facts">
    <div><dt>Official list</dt><dd id="fact-count">55/55 official trophies</dd></div>
    <div><dt>Grades</dt><dd id="fact-grades">1 platinum, 2 gold, 6 silver, 46 bronze <span class="abbr">1P 2G 6S 46B</span></dd></div>
    <div><dt>Cited steps</dt><dd id="fact-steps">—</dd></div>
    <div><dt>Sources read</dt><dd id="fact-sources">—</dd></div>
  </dl>
</header>
<nav id="tabs" class="tabs" role="tablist" aria-label="Desk sections">
  <button type="button" role="tab" id="tab-tracker" data-tab="tracker" aria-selected="true" aria-controls="panel-tracker">Tracker</button>
  <button type="button" role="tab" id="tab-roadmap" data-tab="roadmap" aria-selected="false" aria-controls="panel-roadmap">Roadmap</button>
  <button type="button" role="tab" id="tab-missables" data-tab="missables" aria-selected="false" aria-controls="panel-missables">Missables</button>
  <button type="button" role="tab" id="tab-sources" data-tab="sources" aria-selected="false" aria-controls="panel-sources">Sources</button>
</nav>
<main id="workspace" class="workspace">
  <section id="panel-tracker" class="panel" role="tabpanel" aria-labelledby="tab-tracker"></section>
  <section id="panel-roadmap" class="panel" role="tabpanel" hidden aria-labelledby="tab-roadmap"></section>
  <section id="panel-missables" class="panel tight" role="tabpanel" hidden aria-labelledby="tab-missables"></section>
  <section id="panel-sources" class="panel tight" role="tabpanel" hidden aria-labelledby="tab-sources"></section>
</main>
<p id="note" class="note" hidden></p>
<script type="module" src="js/boot.js"></script>
</body>
</html>
